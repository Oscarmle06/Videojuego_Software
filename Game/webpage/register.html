<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Velocity Draft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-grid"></div>

    <div class="login-box">
      <div class="login-logo text-center mb-1">CREATE ACCOUNT</div>
      
      <form id="registerForm" onsubmit="handleRegister(event)" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" id="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" id="password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Pilot Name</label>
          <input class="form-control" type="text" id="game_name" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">REGISTER</button>
      </form>
    </div>
  </div>

      <div class="text-center mt-3">
        <p class="text-dimmed" style="font-size:.8rem;">
          Already have an account? <a href="login.html" class="text-white">Sign In</a>
        </p>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const userData = {
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        game_name: document.getElementById('game_name').value
      };

      const response = await fetch('http://localhost:3000/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
      });

      const result = await response.json();
      if (result.success) {
        alert("Account created successfully!");
        window.location.href = 'login.html';
      } else {
        alert("Error: " + result.error);
      }
    }
  </script>
</body>
</html>
