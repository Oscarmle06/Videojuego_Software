<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Velocity Draft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-f1">
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-grid"></div>

    <div class="login-box">
      <div class="login-logo text-center mb-1">VELOCITY<br>DRAFT</div>
      <p class="text-center text-dimmed mb-4" style="font-size:.82rem;letter-spacing:1px;">
        Sign in to enter the race
      </p>

      <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username"
                 placeholder="Your username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password"
                 placeholder="Your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-1"
                style="letter-spacing:2px;font-size:.9rem;">
          SIGN IN
        </button>
      </form>

      <div class="login-error-box mt-3 d-none" id="loginError">
        Incorrect username or password. Please try again.
      </div>
    </div>
  </div>
  <div class="text-center mt-3">
  <p class="text-dimmed" style="font-size:.8rem;">
    Don't have an account? <a href="register.html" class="text-white">Create one</a>
  </p>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = 'index.html';

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('loginError');

      // AGREGAMOS EL 'await' AQUÍ
      if (await login(username, password)) { 
        window.location.href = 'index.html';
      } else {
        errorEl.classList.remove('d-none');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>
</body>
</html>
