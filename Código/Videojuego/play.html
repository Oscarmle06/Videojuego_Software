<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Velocity Draft — Game</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

    /* This HTML represents the main game container, with the right proportions */
    #screen {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width:  min(100vw, 207.26vh);
      height: min(48.25vw, 100vh);
      display: flex;
      flex-direction: row;
    }

    #gameCanvas { width: 82.02%; height: 100%;   display: block; }
    #sideColumn { width: 17.98%; height: 100%;   display: flex; flex-direction: column; }
    #mapCanvas  { width: 100%;   height: 37.26%; display: block; }
    #cardCanvas { width: 100%;   height: 62.74%; display: block; }
  </style>
  /* Preload all assets to ensure all assets render properly during gameplay */
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <script type="module" src="src/main.js"></script>
      <link rel="preload" href="./assets/sunnyday.png" as="image">
      <link rel="preload" href="./assets/sunrise.png" as="image">
      <link rel="preload" href="./assets/sunset.png" as="image">

      <link rel="preload" href="./assets/Lose_Screen.png" as="image">
      <link rel="preload" href="./assets/Title_Screen.png" as="image">
      <link rel="preload" href="./assets/321GOMK1.png" as="image">
      <link rel="preload" href="./assets/Positions.png" as="image">
      <link rel="preload" href="./assets/arbol1.png" as="image">
      <link rel="preload" href="./assets/arbol2.png" as="image">
      <link rel="preload" href="./assets/arbol3.png" as="image">
      <link rel="preload" href="./assets/cards/aerodynamic_spoiler.png" as="image">

</head>
