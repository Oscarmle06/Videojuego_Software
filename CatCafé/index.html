<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uchiha Cafe | Cat Café</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">🐾 Uchiha Cafe</a>
            <div class="ms-auto">
                <select id="daySelector" class="form-select border-primary">
                    <option value="Lunes">Lunes</option>
                    <option value="Martes">Martes</option>
                    <option value="Miercoles">Miércoles</option>
                    <option value="Jueves">Jueves</option>
                    <option value="Viernes">Viernes</option>
                    <option value="Sabado">Sábado</option>
                    <option value="Domingo">Domingo</option>
                </select>
            </div>
        </div>
    </nav>

    <section class="container my-5" id="menu-section">
        <h2 class="text-center mb-4">Menú del Día: <span id="currentDayText"></span></h2>
        <div class="row" id="menuContainer">
            </div>
    </section>

    <section class="container my-5" id="cats-section">
        <h2 class="text-center mb-4">Nuestros Anfitriones</h2>
        <div id="uchihaCarousel" class="carousel slide shadow-lg" data-bs-ride="carousel">
            <div class="carousel-indicators" id="carouselIndicators"></div>

            <div class="carousel-inner" id="carouselInner">
                </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#uchihaCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#uchihaCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </section>

    <div class="modal fade" id="menuModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white" style="border: 2px solid #8b0000;">
                <div class="modal-header" style="border-bottom: 1px solid #444;">
                    <h5 class="modal-title font-permanent-marker text-danger" id="modalTitulo"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImagen" src="" class="img-fluid rounded mb-3" style="border: 1px solid #8b0000;">
                    <p id="modalDescripcion" class="lead"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="hoverImagePreview" style="
        display: none; 
        position: absolute; 
        width: 200px; 
        height: 150px; 
        background-size: cover; 
        background-position: center; 
        border: 3px solid #8B0000; 
        border-radius: 10px; 
        z-index: 1000; 
        pointer-events: none; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
